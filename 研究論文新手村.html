<body><div class="shell"><header><div class="brand"><span class="mark" aria-hidden="true">▤</span> PAPER QUEST</div><span class="tag">研究論文新手村</span></header><div class="layout"><aside><div class="eyebrow maptitle">YOUR RESEARCH JOURNEY</div><ol class="journey" id="map" aria-label="六個關卡進度"></ol><div class="botbox"><div class="bot" aria-hidden="true"><i></i><i></i></div><h3>Paper Bot <span class="small">／ 你的研究嚮導</span></h3><p id="botText">論文不是一口氣讀完的。拆成小任務，我們一起來！</p></div></aside><main id="main"><div class="stats"><div class="stat"><div class="small">Research XP</div><strong id="xp">0 / 960</strong></div><div class="stat"><div class="small">研究者 Level</div><strong id="level">Lv. 0</strong></div><div class="progresswrap"><div class="progresslabel"><span>冒險進度</span><span id="progressText">0 / 48</span></div><progress id="progress" value="0" max="48" aria-label="已完成題數">0 / 48</progress></div></div><div id="screen"></div></main></div><footer><span>PAPER QUEST · 把課堂概念，變成研究判讀能力。</span><span>教材主題改編 · 原創教學圖解 · 無須登入</span></footer></div><noscript>請開啟瀏覽器的 JavaScript，才能進行互動遊戲。</noscript>
<script>
'use strict';
const classicStages=[['論文地圖','PAPER STRUCTURE'],['摘要解碼','ABSTRACT'],['研究設計偵探','STUDY DESIGN'],['統計魔王','STATISTICS'],['圖表觀測站','DATA VISUALS'],['迷你 Paper 挑戰','FINAL QUEST']];
const abstract='<b>練習摘要｜每週閱讀練習能幫助新生嗎？</b><br>背景：研究所新生常不熟悉論文閱讀。方法：將 80 名新生隨機分為閱讀工作坊與自學組，持續 4 週。結果：工作坊組的閱讀測驗平均分數較高。結論：工作坊可能改善短期閱讀表現，但仍需評估長期效果。';
const mini='<b>迷你 Paper｜晨間步行與睡眠（虛構）</b><br>研究問題：晨間步行是否與較少睡眠困擾有關？<br>方法：追蹤某校 200 名自願參與的新生 8 週，依原本有無晨間步行習慣分組，並非隨機分派。<br>結果：步行組 20/100 人出現睡眠困擾；非步行組 30/100 人出現睡眠困擾。未調整 RR = 0.67，95% CI 0.41–1.09。<br>限制：自填問卷，未控制課業壓力、咖啡因攝取等因素。';
const classicQuestions=[
{stage:0,title:'想知道「研究怎麼做」，該翻到哪裡？',body:'你想確認研究收了哪些人、如何分組，以及測量了什麼。',options:['Introduction｜前言','Methods｜研究方法','Discussion｜討論'],answer:1,hint:'找描述「對象、流程、測量與分析」的段落。',explain:'Methods 告訴你研究如何進行。Introduction 說明為什麼研究；Results 呈現發現；Discussion 解釋意義與限制。先找對段落，閱讀就不必大海撈針。'},
{stage:0,title:'第一次拿到陌生論文，你會怎麼開始？',body:'目標：先判斷這篇論文與你的研究問題是否相關。',options:['先看 Title、Abstract 與圖表，再依問題深入 Methods、Results','從 References 第一筆開始全部背起來','只看結論，直接當成已證實的事實'],answer:0,hint:'先掌握全貌，再驗證細節；沒有適用所有論文的唯一順序。',explain:'先看標題、摘要與圖表，可以快速定位研究問題。接著讀方法與結果，才能判斷作者結論是否有根據。閱讀順序可依目的調整；Discussion 不能取代證據。'},
{stage:1,title:'這篇研究真正想回答什麼？',passage:abstract,options:['所有研究生都不會閱讀嗎？','哪一本期刊的排名最高？','閱讀工作坊是否能改善新生的閱讀表現？'],answer:2,hint:'把「誰、接受什麼、和誰比較、觀察什麼」串起來。',explain:'研究問題聚焦於新生、工作坊與自學的比較，以及閱讀表現。讀摘要時，試著用一句話整理對象、介入／暴露、比較組與結果，也就是常用的 PICO 思考架構。'},
{stage:1,title:'哪一句屬於 Results，而不是作者的推論？',passage:abstract,options:['工作坊可能改善短期閱讀表現','工作坊組的閱讀測驗平均分數較高','仍需評估長期效果'],answer:1,hint:'Results 是觀察到什麼；Conclusion 是如何解釋它。',explain:'「平均分數較高」描述研究觀察；「可能改善」是解釋。摘要通常很精簡，還要回到正文確認差距多大、不確定性與研究限制，不能只靠這句話判定成效。'},
{stage:2,title:'研究者用抽籤決定分組，這是什麼設計？',body:'研究者隨機分派參與者接受 A 課程或 B 課程，再比較閱讀能力。',options:['隨機對照試驗（RCT）','世代研究（Cohort study）','病例對照研究（Case-control study）'],answer:0,hint:'關鍵不只是「兩組」，而是研究者有沒有隨機分派介入。',explain:'RCT 的核心是隨機分派介入，有助減少組間混雜。它仍可能受到失訪、執行方式等影響；「隨機分派」也不等於從全人口「隨機抽樣」。'},
{stage:2,title:'兩位偵探，誰在做世代研究？',body:'甲：先依有無熬夜分組，追蹤一年後的頭痛。乙：先找有頭痛與沒有頭痛的人，回頭比較過去熬夜情形。',options:['甲是病例對照；乙是世代研究','兩個都是 RCT','甲是世代研究；乙是病例對照'],answer:2,hint:'看選人的起點：暴露狀態，還是有沒有結果／疾病？',explain:'世代研究以暴露分組，觀察結果；病例對照以有無疾病／結果選人，再比較過去暴露。兩者都是觀察性設計，不能因看見關聯就直接認定因果。世代研究也可以使用既有紀錄回溯進行。'},
{stage:3,title:'p = 0.03，究竟在說什麼？',body:'研究事先設定 α = 0.05，檢定「兩組沒有差異」的虛無假設。',options:['虛無假設只有 3% 的機率是真的','在虛無假設及檢定假設成立時，出現目前或更極端資料的機率為 3%','有 97% 的人會因介入而改善'],answer:1,hint:'p-value 是在假設成立的前提下看資料，不是直接計算假設為真的機率。',explain:'p = 0.03 達到事先設定的 0.05 門檻，但不代表效果大或實際重要，也不是「有 3% 機率研究做錯」。還要一起看效應量、信賴區間與研究品質。'},
{stage:3,title:'95% 信賴區間，是什麼意思？',body:'想像用相同方法反覆抽樣，每次都建立一個 95% 信賴區間（CI）。',options:['在模型與抽樣假設成立時，長期約 95% 的這類區間會涵蓋真實參數','95% 的參與者分數都落在這個區間','這篇研究有 95% 的機率完全沒有偏誤'],answer:0,hint:'95% 描述的是反覆使用這種方法的涵蓋率。',explain:'CI 呈現估計的不確定性；區間較寬通常代表估計較不精確。它不能保證沒有偏誤，也不是描述個別受試者的範圍。傳統頻率學派不把已算出的區間解釋成參數有 95% 機率在其中。'},

   height=255;const x=n=>40+n*21;inside+=line(40,125,480,125);v.values.forEach(n=>inside+=dot(x(n),125));[0,5,10,15,20].forEach(n=>inside+=svgText(x(n),155,n));inside+=line(x(v.mean),55,x(v.mean),115,'#f4d88d','4 3')+line(x(v.median),170,x(v.median),133,'#a5efcc','4 3')+svgText(x(v.mean),43,'平均 = '+v.mean,'middle','#f4d88d')+svgText(x(v.median),196,'中位數 = '+v.median,'middle','#a5efcc')+svgText(280,235,'費用（千元）');
  }else if(v.kind==='spread'){
   height=240;const x=n=>100+n*35;[65,145].forEach((y,i)=>{inside+=line(100,y,450,y)+svgText(36,y+6,i?'B':'A');(i?[0,5,10]:[4,5,6]).forEach(n=>inside+=dot(x(n),y,i?'#f4d88d':'#a5efcc'));});[0,5,10].forEach(n=>inside+=svgText(x(n),196,n));inside+=line(x(5),30,x(5),170,'#aabdc1','4 5')+svgText(275,227,'平均皆為 5');
  }else if(v.kind==='box'){
   height=260;const x=n=>45+n*21;inside+=line(x(1),105,x(20),105)+`<rect x="${x(2.5)}" y="70" width="84" height="70" fill="#244c3d" stroke="#a5efcc" stroke-width="2"/>`+line(x(4.5),70,x(4.5),140,'#f4d88d')+line(x(1),86,x(1),124)+line(x(20),86,x(20),124);inside+=svgText(x(2.5),57,'Q1=2.5')+svgText(x(6.5)+26,57,'Q3=6.5');inside+=svgText(x(1),165,'1')+svgText(x(20),165,'20')+svgText(273,206,'IQR = 6.5 − 2.5 = 4','middle','#a5efcc')+svgText(273,236,'全距 = 20 − 1 = 19');
  }else if(v.kind==='hist'){
   height=285;inside+=line(54,35,54,235)+line(54,235,486,235);[2,7,12,7,3,2,5,11,8,3].forEach((n,i)=>inside+=`<rect x="${60+i*42}" y="${235-n*14}" width="39" height="${n*14}" fill="#80c7aa"/>`);[0,6,12].forEach(n=>inside+=svgText(44,240-n*14,n,'end'));inside+=svgText(20,22,'人數','start')+svgText(272,272,'健康指標（等寬區間）');
  }else if(v.kind==='estimator'){
   height=245;inside+=line(60,144,460,144)+line(260,50,260,177,'#f4d88d','5 4');[135,170,205,235,260,285,315,350,385].forEach((x,i)=>inside+=dot(x,100+(i%3)*16));inside+=svgText(260,211,'母體真值 μ','middle','#f4d88d')+svgText(260,31,'每個圓點代表一次抽樣的估計','middle','#cfe0e1',15);
  }else if(v.kind==='ci'){
   height=325;inside+=line(280,20,280,265,'#f4d88d','5 4');[[180,325],[230,390],[290,410],[160,300],[235,355],[175,305]].forEach(([a,b],i)=>{let y=45+i*38,c=a>280?'#ffa9a3':'#a5efcc';inside+=svgText(25,y+5,'樣本 '+(i+1),'start','#c6d9dc',15)+line(a,y,b,y,c)+dot((a+b)/2,y,c,4);});inside+=svgText(280,290,'固定的母體真值','middle','#f4d88d')+svgText(280,316,'紅色區間未涵蓋真值','middle','#ffa9a3',15);
  }else if(v.kind==='normal'){
   height=300;const x=z=>260+64*z,y=z=>235-175*Math.exp(-z*z/2);let pts=[];for(let z=-3.5;z<=3.51;z+=.05)pts.push([z,x(z),y(z)]);const path=pts.map((p,i)=>(i?'L':'M')+p[1].toFixed(2)+' '+p[2].toFixed(2)).join(' ');inside+=line(30,235,490,235);[-1,1].forEach(sign=>{let subset=pts.filter(p=>sign<0?p[0]<=-1.96:p[0]>=1.96);inside+=`<path d="M${subset[0][1]} 235 ${subset.map(p=>'L'+p[1]+' '+p[2]).join(' ')}L${subset[subset.length-1][1]} 235Z" fill="#f4d88d"/>`;});inside+=`<path d="${path}" fill="none" stroke="#a5efcc" stroke-width="3"/>`;[-1.96,0,1.96].forEach(z=>inside+=line(x(z),235,x(z),y(z),'#8ba3a7','3 4')+svgText(x(z),261,z));inside+=svgText(260,139,'中央約 95%')+svgText(67,192,'2.5%','middle','#f4d88d')+svgText(451,192,'2.5%','middle','#f4d88d')+svgText(260,292,'Z（標準常態）');
  }else if(v.kind==='errors'){
   content=`<div class="tablewrap" tabindex="0" role="region" aria-label="檢定決策表"><table><thead><tr><th>決策／真相</th><th>H₀ 為真</th><th>指定的 H₁ 為真</th></tr></thead><tbody><tr><th>拒絕 H₀</th><td class="errorcell">第一類錯誤 α</td><td>檢定力 1−β</td></tr><tr><th>未拒絕 H₀</th><td>正確保留</td><td class="errorcell">第二類錯誤 β</td></tr></tbody></table></div>`;
  }
  if(!content)content=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 ${height}" role="img" aria-label="${esc(v.title)}"><title>${esc(v.title)}</title>${inside}</svg>`;
 }
 return `<figure class="learning-figure"><figcaption>${esc(v.title)}</figcaption><div class="visual-scroll" tabindex="0" role="region" aria-label="圖解，可左右滑動">${content}</div>${v.caption&&!prompt?`<p class="small">${esc(v.caption)}</p>`:''}<p class="figure-note">${v.kind==='km'?'教材資料重繪':'原創教學圖解'} · ${prompt?'先觀察圖表，再選答案':'搭配上方步驟閱讀'} · 窄螢幕可左右滑動圖表</p></figure>`;
}
function sourceMarkup(q){if(!q.source)return '';return `<div class="source-note"><b>回到課堂教材</b>${q.source.map(([n,p])=>`<span>${lectures[n].name} · ${n===2?'投影片':'PDF 頁'} ${esc(p)}</span>`).join('')}<span>${q.supplement?'本題含研究方法延伸補充。':'題目依教材主題改編，解析補充必要假設。'}</span></div>`;}
function explanation(q){if(!q.steps)return `<p>${q.explain}</p>`;return `<div class="explain-steps"><h4>一步一步想</h4><ol>${q.steps.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></div>${figure(q.visual)}<div class="option-reasons"><h4>為什麼其他選項不適合？</h4>${q.why.map((w,i)=>`<p><b>${'ABC'[i]}${i===q.answer?' ✓':''}</b> ${esc(w)}</p>`).join('')}</div>${sourceMarkup(q)}`;}
function update(){const xp=answers.filter((a,i)=>a===questions[i].answer).length*20;$('xp').textContent=xp+' / '+MAX_XP;$('level').textContent='Lv. '+Math.floor(xp/50);$('progress').max=TOTAL;$('progress').value=answers.length;$('progress').textContent=answers.length+' / '+TOTAL;$('progressText').textContent=answers.length+' / '+TOTAL;$('map').innerHTML=stages.map((s,i)=>{const complete=questions.every((q,j)=>q.stage!==i||j<answers.length),active=started&&current<TOTAL&&questions[current].stage===i;return `<li class="${complete?'done':active?'active':''}" ${active?'aria-current="step"':''} title="${s[0]}"><span class="node">${complete?'✓':String(i+1).padStart(2,'0')}</span><span class="label">${s[0]}<small>${s[1]} · ${questions.filter(q=>q.stage===i).length} 題</small></span></li>`}).join('');}
function focusTitle(){const el=$('viewTitle');if(el)el.focus({preventScroll:true});$('main').scrollIntoView({block:'start',behavior:'auto'});}
function setMode(next){mode=next;questions=mode==='course'?courseQuestions:classicQuestions;stages=mode==='course'?courseStages:classicStages;TOTAL=questions.length;MAX_XP=TOTAL*20;current=0;answers=[];hinted=new Set();started=false;home();}
function sourcesPanel(){return `<details><summary>教材範圍與解讀提醒</summary><div class="source-list">${lectures.slice(1).map(l=>`<p><b>${l.name}</b><br>${l.file}<br><span class="small">${l.pages} ${l===lectures[2]?'張投影片':'頁'}</span></p>`).join('')}</div><p class="small">頁碼依原檔順序，封面算第 1 頁。題目是教學改編，不是授課教師原題；虛構數值與原教材範例會分別註明。</p><ul class="small"><li>CI 包含 1 表示仍有不確定性，不能直接斷言「沒有效果」。</li><li>Log-rank 利用各事件時點，不只看後期；Wilcoxon 通常較重視早期。</li><li>匹配與 Cox 調整都不能保證消除所有混雜；半參數模型仍有假設。</li></ul><p class="small">延伸核對：<a href="https://support.sas.com/documentation/cdl/en/statug/68162/HTML/default/statug_lifetest_details16.htm" target="_blank" rel="noopener noreferrer">SAS：存活曲線比較</a>、<a href="https://support.sas.com/documentation/cdl/en/statug/66859/HTML/default/statug_phreg_overview.htm" target="_blank" rel="noopener noreferrer">SAS：Cox 模型</a>、<a href="https://support.sas.com/documentation/cdl/en/statug/68162/HTML/default/statug_lifetest_syntax07.htm" target="_blank" rel="noopener noreferrer">SAS：事件與競爭事件</a>、<a href="https://www.amstat.org/asa/files/pdfs/p-valuestatement.pdf" target="_blank" rel="noopener noreferrer">ASA：p 值解讀</a>。</p></details>`;}
function home(){update();$('botText').textContent='先自己判斷，再看圖解。算錯不是失敗，找出分母與假設才是重點。';$('screen').innerHTML=`<section class="fade"><div class="eyebrow">PAPER QUEST / COURSE EDITION</div><h1 id="viewTitle" tabindex="-1">讀懂研究，<br>也<span>看懂數據</span>。</h1><p class="lead">從課堂概念走到研究判讀。用圖解拆開公式，理解每個答案背後的理由。</p><div class="mode-picker" role="group" aria-label="選擇題庫"><button class="mode ${mode==='course'?'selected':''}" id="courseMode" aria-pressed="${mode==='course'}"><b>課堂圖解篇</b><span>48 題 · 三份教材 · 分步解析</span></button><button class="mode ${mode==='classic'?'selected':''}" id="classicMode" aria-pressed="${mode==='classic'}"><b>論文閱讀篇</b><span>30 題 · 論文架構與批判思考</span></button></div><div class="story"><div class="small">研究所 · 本週 Lab Meeting</div><p>教授：「這次除了結論，也請說明設限、分析方法與不確定性。」</p><p><b style="color:var(--mint)">Paper Bot：</b>「${mode==='course'?'我們從資料與事件開始，接著讀 KM、Cox 和統計推論。每題都有圖解，也能回查教材頁碼。':'先掌握論文架構，再練習研究設計與證據判讀。'}」</p></div><div class="startrow"><button class="primary" id="start">開始${mode==='course'?'課堂圖解':'論文閱讀'}挑戰 →</button><span class="small">約 ${mode==='course'?'45–60':'25–35'} 分鐘 · 提示不扣分</span></div><div class="features"><span><b>06</b> 個關卡</span><span><b>${TOTAL}</b> 道題目</span><span><b>${MAX_XP}</b> XP 上限</span></div><p class="small">答對 +20 XP，每 50 XP 升 1 級。答錯也能繼續。每題選擇後顯示解析；重新整理或切換題庫會清空本次進度。</p>${mode==='course'?sourcesPanel():''}</section>`;$('start').onclick=()=>{started=true;render();};$('courseMode').onclick=()=>setMode('course');$('classicMode').onclick=()=>setMode('classic');}
function render(){update();const q=questions[current];$('botText').textContent=mode==='course'?['先問研究問題，再決定資料與分母。','事件與設限分開記，觀察時間才有意義。','每一階都有自己的分母；不要一路用初始人數。','先確認比較組與單位，再解讀 HR。','先看分布，再選描述數字與 SAS 程序。','把設計、效應量、CI 與限制一起說清楚。'][q.stage]:['先看地圖，再找線索。','用一句話整理研究問題。','研究者有沒有分派介入？','數字要連同假設一起讀。','先看軸線與分母。','把證據與限制一起說明。'][q.stage];$('screen').innerHTML=`<section class="card fade"><div class="qtop"><span class="eyebrow">MISSION 0${q.stage+1} / ${stages[q.stage][0]}</span><span class="pill">答對 +20 XP</span></div><div class="small" style="margin-top:16px">挑戰 ${String(current+1).padStart(2,'0')} / ${TOTAL} · ${q.difficulty}</div><h2 id="viewTitle" tabindex="-1">${q.title}</h2>${q.body?`<p class="lead">${q.body}</p>`:''}${q.passage?`<div class="passage">${q.passage}</div>`:''}${q.chart?chart(q.chart):''}${q.promptVisual?figure(q.visual,true):''}<div class="options" role="group" aria-label="選擇一個答案">${q.options.map((o,i)=>`<button class="option" data-choice="${i}"><span class="letter">${'ABC'[i]}</span><span>${o}</span></button>`).join('')}</div><div class="actions"><button class="secondary" id="hintBtn" aria-expanded="false" aria-controls="hint">✧ Paper Bot 提示</button><span class="small">選擇後可看${mode==='course'?'圖解與逐項':'中文'}解析</span></div><div class="hint" id="hint" hidden>🤖 ${q.hint}</div><div id="feedback"></div><div class="actions next-row"><span id="answerStatus" role="status" aria-live="polite"></span><button class="primary" id="next" hidden>下一題 →</button></div></section>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.choice)));$('hintBtn').onclick=()=>{const show=$('hint').hidden;$('hint').hidden=!show;$('hintBtn').setAttribute('aria-expanded',String(show));if(show)hinted.add(current);};$('next').onclick=()=>{if(answers.length!==current+1)return;current++;if(current===TOTAL)finish();else render();};focusTitle();}
function answer(choice){if(answers.length>current||current>=TOTAL||!Number.isInteger(choice)||choice<0||choice>=questions[current].options.length)return;const q=questions[current];answers.push(choice);document.querySelectorAll('[data-choice]').forEach(b=>{const n=Number(b.dataset.choice);b.disabled=true;if(n===q.answer)b.classList.add('correct');else if(n===choice)b.classList.add('wrong');if(n===q.answer)b.querySelector('.letter').textContent='✓';else if(n===choice)b.querySelector('.letter').textContent='×';});const correct=choice===q.answer;$('feedback').innerHTML=`<div class="feedback ${correct?'':'bad'}"><h3 tabindex="-1" id="explanationTitle">${correct?'✦ 線索破解！+20 XP':'✧ 找到需要釐清的觀念！+0 XP'}</h3><p><b>正確答案：${'ABC'[q.answer]}</b> · ${q.options[q.answer]}</p>${explanation(q)}</div>`;$('answerStatus').textContent=correct?'答對！已增加 20 XP。':'已顯示正確答案與解析。';$('next').hidden=false;$('next').textContent=current===TOTAL-1?'查看學習成果 →':questions[current+1].stage!==q.stage?'前往下一關 →':'下一題 →';update();$('explanationTitle').focus({preventScroll:true});$('feedback').scrollIntoView({block:'start',behavior:'auto'});}
function finish(){update();const correct=answers.filter((a,i)=>a===questions[i].answer).length,ratio=correct/TOTAL,title=ratio>=.85?'研究探索家':ratio>=.6?'論文解碼員':'勇敢的新手研究者';$('botText').textContent='學習不只看分數。回顧答錯的概念，再回教材讀一次，會更有收穫。';$('screen').innerHTML=`<section class="card fade"><div class="eyebrow">MISSION COMPLETE / 學習完成</div><h1 id="viewTitle" tabindex="-1" style="font-size:34px">你好，<span>${title}</span>！</h1><p class="lead">已完成${mode==='course'?'課堂圖解篇':'論文閱讀篇'}的六個關卡。</p><div class="resultscore"><div class="scorecircle"><strong>${Math.round(ratio*100)}<span style="font-size:16px"> 分</span></strong><span class="small">答對 ${correct} / ${TOTAL}</span></div><div><h3>${correct*20} Research XP · Lv. ${Math.floor(correct*20/50)}</h3><p class="small">使用提示 ${hinted.size} 題，不影響分數。<br>這是練習回饋，不代表正式課程成績。</p></div></div><div class="summarygrid">${stages.map((s,i)=>{const ids=questions.map((q,j)=>q.stage===i?j:-1).filter(j=>j>=0);return `<div class="summaryitem"><span>${i+1}. ${s[0]}</span><b>${ids.filter(j=>answers[j]===questions[j].answer).length} / ${ids.length}</b></div>`}).join('')}</div><div class="review-toolbar"><h3>題目回顧與詳解</h3><label><input type="checkbox" id="wrongOnly"> 只看答錯的題目</label></div><p id="reviewCount" class="small"></p><div id="reviewList"></div>${mode==='course'?sourcesPanel():''}<div class="actions"><button class="primary" id="restart">↻ 重新挑戰本篇</button><button class="secondary" id="returnHome">返回首頁選題庫</button></div></section>`;const review=()=>{const wrongOnly=$('wrongOnly').checked,ids=questions.map((_,i)=>i).filter(i=>!wrongOnly||answers[i]!==questions[i].answer);$('reviewCount').textContent=ids.length?'顯示 '+ids.length+' 題；展開題目可看完整解析。':'全部答對，沒有錯題！';$('reviewList').innerHTML=ids.map(i=>{const q=questions[i];return `<details class="review"><summary>${answers[i]===q.answer?'✓':'△'} ${i+1}. ${q.title}</summary>${q.body?`<p>${q.body}</p>`:''}${q.passage?`<div class="passage">${q.passage}</div>`:''}${q.chart?chart(q.chart):''}<p>你的答案：${'ABC'[answers[i]]} · ${q.options[answers[i]]}<br><b>正確答案：${'ABC'[q.answer]} · ${q.options[q.answer]}</b></p>${explanation(q)}</details>`}).join('');};$('wrongOnly').onchange=review;review();$('restart').onclick=()=>{current=0;answers=[];hinted=new Set();started=true;render();};$('returnHome').onclick=()=>{setMode(mode);focusTitle();};focusTitle();}
home();

</script></body></html>
